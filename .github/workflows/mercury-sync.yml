name: Mercury board sync
on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mercury-board-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate public projection
        run: node --test mercury/sync/tests/projection.test.mjs
      - name: Read approved Mercury records
        env:
          MERCURY_PLAN_READ_TOKEN: ${{ secrets.MERCURY_PLAN_READ_TOKEN }}
        run: node mercury/sync/sync.mjs
      - name: Publish only Mercury data
        run: |
          git add -- mercury/data.json
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = "mercury/data.json"
          git config user.name 'Mercury board sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync approved Mercury board data'
          git pull --rebase origin main
          git push origin HEAD:main
