name: Update Mercury board records
on:
  workflow_dispatch:
    inputs:
      changes:
        description: 'JSON array of approved record patches or explicit new Pin creations; no credentials or private data'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: mercury-board-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate public projection and update contract
        id: validation
        run: node --test mercury/sync/tests/projection.test.mjs
      - name: Update source records with revision checks
        env:
          MERCURY_PLAN_READ_TOKEN: ${{ secrets.MERCURY_PLAN_READ_TOKEN }}
          BOARD_CHANGES: ${{ inputs.changes }}
        run: node mercury/sync/update.mjs
      - name: Refresh public projection
        id: snapshot
        if: ${{ !cancelled() && steps.validation.outcome == 'success' }}
        env:
          MERCURY_PLAN_READ_TOKEN: ${{ secrets.MERCURY_PLAN_READ_TOKEN }}
        run: node mercury/sync/sync.mjs
      - name: Publish only Mercury data
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        run: |
          git add -- mercury/data.json
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = "mercury/data.json"
          git config user.name 'Mercury board sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync approved Mercury publication updates'
          git pull --rebase origin main
          git push origin HEAD:main
